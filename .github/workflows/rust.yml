name: Build 32-bit Windows Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-32:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain & 32-bit target
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: i686-pc-windows-msvc

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        # Caches dependencies to speed up subsequent workflow runs
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run Cargo Build (Release)
      run: cargo build --target i686-pc-windows-msvc --release

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-i686-release-binary
        # Adjust the path below if your binary name is different
        path: target/i686-pc-windows-msvc/release/*.exe
